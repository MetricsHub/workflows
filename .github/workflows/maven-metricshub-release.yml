# Fully automated release to repo.metricshub.com
#
# This workflow performs the following operations:
#
# - Create a release branch
# - Prepare the release with Maven
# - Perform the release to repo.metricshub.com
# - Upload Maven Site to GitHub Pages
# - Publish the packages as a GitHub Release
# - Create a Pull Request to prepare next development version
#
# Requires the below secrets to be defined (workspace or organization):
#
# - MAVEN_GPG_PRIVATE_KEY
# - MAVEN_GPG_PASSPHRASE
# - REPO_METRICSHUB_USERNAME
# - REPO_METRICSHUB_TOKEN

name: Release to repo.metricshub.com
run-name: Release v${{ inputs.releaseVersion }} to repo.metricshub.com

on:
  workflow_call:
    inputs:
      releaseVersion:
        type: string
        description: "Release version"
        required: true
        default: ""
      developmentVersion:
        type: string
        description: "New SNAPSHOT version"
        required: true
        default: ""
      jdkVersion:
        type: string
        description: "Version of the JDK to setup and use"
        required: false
        default: "17"
      mavenOptions:
        type: string
        description: "Maven options to pass to all the release steps"
        required: false
        default: ""
      nodeVersion:
        type: string
        description: "Version of Node.js to setup and use (if needed)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write
  issues: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these releases and deployments to complete.
concurrency:
  group: release
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release v${{ inputs.releaseVersion }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK ${{ inputs.jdkVersion }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.jdkVersion }}
        distribution: temurin
        java-package: jdk
        cache: maven
        overwrite-settings: false
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE

    # release:perform runs a forked Maven build, which uses the same ~/.m2/settings.xml and environment
    - name: Set up Maven settings.xml
      uses: s4u/maven-settings-action@v4.1.0
      with:
        override: true
        repositories: |
          [
            {
              "id": "metricshub",
              "name": "metricshub-repository",
              "url": "https://repo.metricshub.com/repository/maven-public",
              "snapshots": { "enabled": true },
              "releases": { "enabled": true }
            }
          ]
        servers: |
          [
            {
              "id": "metricshub",
              "username": "${env.REPO_METRICSHUB_USERNAME}",
              "password": "${env.REPO_METRICSHUB_TOKEN}"
            }
          ]

    - name: Configure Maven debug flag
      run: echo "debugFlag=--debug" >> $GITHUB_ENV
      if: ${{ runner.debug == '1' }}

    - name: Setup Node.js ${{ inputs.nodeVersion }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.nodeVersion }}
        cache: npm
      if: ${{ inputs.nodeVersion != '' }}

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v6
      with:
        enablement: true

    - name: Configure Git User
      run: |
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"

    - name: Set release branch and tag name
      run: |
        echo "branchName=release/v$INPUT_RELEASEVERSION" >> $GITHUB_ENV
        echo "tagName=v$INPUT_RELEASEVERSION" >> $GITHUB_ENV
      env:
        INPUT_RELEASEVERSION: ${{ inputs.releaseVersion }}

    - name: Create ${{ env.branchName }} branch
      run: |
        git checkout ${{ env.branchName }} 2>/dev/null || git checkout -b ${{ env.branchName }}
        git push --force origin ${{ env.branchName }}

    - name: Clean up existing ${{ env.tagName }} tags
      run: |
        git tag -d ${{ env.tagName }} || true
        git push origin :refs/tags/${{ env.tagName }} || true

    - name: Prepare release
      id: prepare
      run: |
        mvn ${{ env.debugFlag }} --batch-mode -U \
          -Prelease \
          release:clean \
          release:prepare \
          -DpreparationGoals="clean verify site" \
          -Dgpg.passphraseServerId=gpg.passphrase \
          -Darguments=-Dgpg.passphraseServerId=gpg.passphrase \
          -DreleaseVersion=${{ inputs.releaseVersion }} \
          -DdevelopmentVersion=${{ inputs.developmentVersion }} \
          -Dresume=false \
          ${{ inputs.mavenOptions }}
      env:
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        REPO_METRICSHUB_USERNAME: ${{ secrets.REPO_METRICSHUB_USERNAME }}
        REPO_METRICSHUB_TOKEN: ${{ secrets.REPO_METRICSHUB_TOKEN }}

    - name: Perform release to repo.metricshub.com
      id: release
      run: |
        mvn ${{ env.debugFlag }} --batch-mode -U \
          -Prelease \
          release:perform \
          -Dgoals="deploy site" \
          -DworkingDirectory=$GITHUB_WORKSPACE/target/release \
          -Dgpg.passphraseServerId=gpg.passphrase \
          -Darguments=-Dgpg.passphraseServerId=gpg.passphrase \
          -DreleaseVersion=${{ inputs.releaseVersion }} \
          -DdevelopmentVersion=${{ inputs.developmentVersion }} \
          ${{ inputs.mavenOptions }}
      env:
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        REPO_METRICSHUB_USERNAME: ${{ secrets.REPO_METRICSHUB_USERNAME }}
        REPO_METRICSHUB_TOKEN: ${{ secrets.REPO_METRICSHUB_TOKEN }}

    - name: Release rollback on failure
      run: |
        mvn ${{ env.debugFlag }} --batch-mode -U \
          -Prelease \
          release:rollback \
          ${{ inputs.mavenOptions }}
      if: always() && (steps.prepare.outcome == 'failure' || steps.release.outcome == 'failure')

    - name: Upload Maven Site to GitHub Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./target/release/target/site

    - name: Create a GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.tagName }}
        fail_on_unmatched_files: false
        generate_release_notes: true
        files: |
          ./target/release/target/*.jar
          ./target/release/target/*.buildinfo

    - name: Create Pull Request from ${{ env.branchName }} to ${{ github.event.repository.default_branch }}
      uses: devops-infra/action-pull-request@v1.4.0
      with:
        github_token: ${{ github.token }}
        source_branch: ${{ env.branchName }}
        target_branch: ${{ github.event.repository.default_branch }}
        title: Release v${{ inputs.releaseVersion }} and prepare v${{ inputs.developmentVersion }}
        body: |
          ## Automated release

          * Release **v${{ inputs.releaseVersion }}**
          * Prepare **v${{ inputs.developmentVersion }}**
        label: automatic
        get_diff: true
        allow_no_diff: true

  # Deployment job
  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: release
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
