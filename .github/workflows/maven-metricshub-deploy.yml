# Build with Maven and deploy to repo.metricshub.com
#
# This is not a release workflow, use it to deploy a SNAPSHOT
# version of your project.
#
# Call this workflow on push to the base branch.
#
# Requirements:
#
# - REPO_METRICSHUB_USERNAME secret (at the repository or organization level)
# - REPO_METRICSHUB_TOKEN secret
# - distributionManagement in pom.xml using the "metricshub" server id

name: Maven Deploy to repo.metricshub.com

on:
  workflow_call:
    inputs:
      mavenOptions:
        type: string
        description: "Maven options to pass to the deploy command"
        required: false
        default: ""
      jdkVersion:
        type: string
        description: "Version of the JDK to setup and use"
        required: false
        default: "17"
      nodeVersion:
        type: string
        description: "Version of Node.js to setup and use (if needed)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK ${{ inputs.jdkVersion }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.jdkVersion }}
        distribution: temurin
        java-package: jdk
        cache: maven
        overwrite-settings: false

    - name: Set up Maven settings.xml
      uses: s4u/maven-settings-action@v4.1.0
      with:
        override: true
        repositories: |
          [
            {
              "id": "metricshub",
              "name": "metricshub-repository",
              "url": "https://repo.metricshub.com/repository/maven-public",
              "snapshots": { "enabled": true },
              "releases": { "enabled": true }
            }
          ]
        pluginRepositories: |
          [
            {
              "id": "metricshub",
              "name": "metricshub-repository",
              "url": "https://repo.metricshub.com/repository/maven-public",
              "snapshots": { "enabled": true },
              "releases": { "enabled": true }
            }
          ]
        servers: |
          [
            {
              "id": "metricshub",
              "username": "${env.REPO_METRICSHUB_USERNAME}",
              "password": "${env.REPO_METRICSHUB_TOKEN}"
            }
          ]

    - name: Configure Maven debug flag
      run: echo "debugFlag=--debug" >> $GITHUB_ENV
      if: ${{ runner.debug == '1' }}

    - name: Setup Node.js ${{ inputs.nodeVersion }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.nodeVersion }}
        cache: npm
      if: ${{ inputs.nodeVersion != '' }}

    - name: Build and deploy to repo.metricshub.com
      run: mvn ${{ env.debugFlag }} --batch-mode --file pom.xml deploy ${{ inputs.mavenOptions }}
      env:
        REPO_METRICSHUB_USERNAME: ${{ secrets.REPO_METRICSHUB_USERNAME }}
        REPO_METRICSHUB_TOKEN: ${{ secrets.REPO_METRICSHUB_TOKEN }}

    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    # (the action runs Maven with the settings.xml above, so it needs the credentials too)
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c
      env:
        REPO_METRICSHUB_USERNAME: ${{ secrets.REPO_METRICSHUB_USERNAME }}
        REPO_METRICSHUB_TOKEN: ${{ secrets.REPO_METRICSHUB_TOKEN }}
