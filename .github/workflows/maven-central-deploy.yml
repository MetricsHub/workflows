# Build with Maven and deploy to Maven Central
#
# This is not a release workflow, use it to deploy a SNAPSHOT
# version of your project.
#
# Call this workflow on push to the base branch.
#
# Requirements:
#
# - MAVEN_CENTRAL_USERNAME secret (at the repository or organization level)
# - MAVEN_CENTRAL_TOKEN secret

name: Maven Deploy to Maven Central

on:
  workflow_call:
    inputs:
      mavenOptions:
        type: string
        description: "Maven options to pass to the deploy command"
        required: false
        default: ""
      jdkVersion:
        type: string
        description: "Version of the JDK to setup and use"
        required: false
        default: "17"
      nodeVersion:
        type: string
        description: "Version of Node.js to setup and use (if needed)"
        required: false
        default: ""

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up JDK ${{ inputs.jdkVersion }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.jdkVersion }}
        distribution: temurin
        cache: maven

    # Keep publishing independent of the Maven version in the runner image.
    - name: Set up Maven 3.9.16
      shell: bash
      run: |
        archive="$RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz \
          --output "$archive"
        echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $archive" | sha512sum --check
        tar -xzf "$archive" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
        echo "MAVEN_HOME=$RUNNER_TEMP/apache-maven-3.9.16" >> "$GITHUB_ENV"

    - name: Verify Maven version
      shell: bash
      run: |
        maven_version="$(mvn --version --batch-mode -Dstyle.color=never)"
        printf '%s\n' "$maven_version"
        grep -Eq '^Apache Maven 3\.9\.16([[:space:]]|$)' <<< "$maven_version"

    - name: Set up Maven settings.xml
      uses: s4u/maven-settings-action@v4.0.0
      with:
        servers: '[{"id": "central", "username": "${env.MAVEN_CENTRAL_USERNAME}", "password": "${env.MAVEN_CENTRAL_TOKEN}"}]'
        sonatypeSnapshots: true

    - name: Setup Node.js ${{ inputs.nodeVersion }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.nodeVersion }}
        cache: npm
      if: ${{ inputs.nodeVersion != '' }}

    - name: Build and deploy to Maven Central
      run: mvn -B deploy --file pom.xml ${{ inputs.mavenOptions }}
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

    # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8
